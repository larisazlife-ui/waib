/* Общие помощники: экранирование, числа, форматирование ru-RU */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[\s ]/g,'').replace(',','.'));return isFinite(n)?n:NaN};
const fmt=(n,d=0)=>isFinite(n)?n.toLocaleString('ru-RU',{maximumFractionDigits:d}):'—';
const money=n=>isFinite(n)?fmt(n)+' ₸':'—';
const dt=t=>t?new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const filled=v=>String(v??'').trim()!=='';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const G=(t,ok,v)=>({t,ok:ok===null||ok===undefined?null:!!ok,v});
const has=(...xs)=>xs.every(x=>isFinite(x));
const compAvg=p=>{const a=(p.comps||[]).map(c=>num(c.p)).filter(x=>x>0);return a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN};
const compN=p=>(p.comps||[]).filter(c=>filled(c.n)).length;
const density=n=>n===0?0:n<=2?15:n<=5?10:n<=10?5:2;


/* Разбор таблицы, вставленной из Excel или с сайта: «название | значение».
   Разделители — табуляция, «;» или «|». Берётся последнее число в строке; строки без положительного числа пропускаются. */
function parseComps(text){const rows=[];
 for(const ln of String(text||'').split(/\r?\n/)){const c=ln.split(/\t|;|\|/).map(x=>x.trim()).filter(Boolean);if(c.length<2)continue;
  let v=NaN;for(let i=c.length-1;i>0;i--){v=num(c[i]);if(isFinite(v))break}
  if(isFinite(v)&&v>0)rows.push({n:c[0],p:String(v)})}
 return rows}

/* Реестр технологических карт. Порядок задаёт порядок на экране «Новый продукт». */
const TPL={annuity:ANNUITY,endow:ENDOW,osns:OSNS};

/* ---- js/state.js ---- */
/* Состояние, правила маршрута и хранение */
/* ================= СОСТОЯНИЕ ================= */
const CID=Math.random().toString(36).slice(2,10),LS='product-route-v1';
let db=null,user=null,sample=null,uid=null;
let products={},cur=null,si=0,timers={},busy={},again={},view='main',draft=null;
const P=()=>products[cur];
const T=p=>TPL[p&&p.tpl]||ANNUITY;
/* Продукты по удалённым картам (например, «Производство») остаются в хранилище, но не показываются */
const known=p=>!!(p&&TPL[p.tpl]);
const hiddenCount=()=>Object.values(products).filter(p=>!known(p)).length;
function firstId(){return Object.keys(products).filter(id=>known(products[id])).sort((a,b)=>(products[b].created||0)-(products[a].created||0))[0]||null}
const S=p=>T(p).stages.filter(s=>!(p.skip||[]).includes(s.id));
function blank(tpl,skip,name){const t=TPL[tpl],id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 return {id,tpl,skip:skip||[],created:Date.now(),f:Object.assign({name:name||'Новый продукт'},t.defaults),checks:{},status:{},by:{},at:{},comment:{},comps:[],ai:{},log:[]}}
function st(p,i){const L=S(p),s=p.status[L[i].id];if(s==='approved')return'ok';if(i>0&&p.status[L[i-1].id]!=='approved')return'lock';return s==='rework'?'rw':'op'}
function firstOpen(p){const L=S(p);for(let i=0;i<L.length;i++)if(p.status[L[i].id]!=='approved')return i;return L.length-1}
const calc=p=>T(p).calc(p);
const gates=p=>T(p).gates(p,calc(p));
/* Чего не хватает для согласования этапа i.
   Каждый пункт: { t: текст, ref: id элемента на странице } или { t, go: номер этапа }. */
function missing(p,i){const L=S(p),s=L[i],m=[];for(const x of s.fields)if(x.r&&!filled(p.f[x.k]))m.push({t:x.l,ref:'f_'+x.k});
 const ch=p.checks[s.id]||[];s.checks.forEach((c,j)=>{if(!ch[j])m.push({t:'☐ '+c,ref:'chk_'+j})});
 if(s.comps&&(p.comps||[]).filter(c=>filled(c.n)&&num(c.p)>0).length<3)m.push({t:'Не менее 3 конкурентов с данными',ref:'comps'});
 if(s.gates)L.slice(0,-1).forEach((x,j)=>{if(p.status[x.id]!=='approved')m.push({t:'Не согласован этап «'+x.name+'»',go:j})});
 return m}

/* Отзыв согласования этапа i: этап и все последующие возвращаются в работу. */
function revokeFrom(p,i){const L=S(p);p.status[L[i].id]='draft';
 for(let j=i+1;j<L.length;j++){const id=L[j].id;if(p.status[id]==='approved')p.status[id]='draft'}}

/* ================= ХРАНЕНИЕ ================= */
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(products))}catch(e){}}
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||'{}');if(v&&typeof v==='object')products=v}catch(e){}}
function setSync(t){$('#sync').textContent=t}
function touch(p){p._c=CID;p._t=Date.now();clearTimeout(timers[p.id]);timers[p.id]=setTimeout(()=>{timers[p.id]=null;persist(p.id)},600)}
async function persist(id){if(!db){lsSave();return}
 if(busy[id]){again[id]=1;return}busy[id]=1;setSync('Сохранение…');
 try{const p=products[id];if(p)await db.doc('products/'+id).set(JSON.parse(JSON.stringify(p)));setSync('Сохранено · общий доступ')}
 catch(e){setSync(e&&e.code==='invalid_argument'?'Только просмотр: нет прав на изменение':'Ошибка сохранения')}
 busy[id]=0;if(again[id]){again[id]=0;persist(id)}}
function addLog(p,x){p.log=p.log||[];p.log.unshift({t:Date.now(),u:uid||'',x});if(p.log.length>150)p.log.length=150}
async function fillNames(){if(!user)return;const els=[...document.querySelectorAll('[data-uid]')];const ids=[...new Set(els.map(e=>e.dataset.uid).filter(Boolean))];if(!ids.length)return;
 try{const ps=await user.profiles(ids);for(const e of els){const n=ps?.[e.dataset.uid]?.name;if(n)e.textContent=n}}catch(e){}}

function buildFixtures(now){now=now||Date.now();const out={};
 FIXTURES.forEach((fx,n)=>{const t=TPL[fx.tpl],p=blank(fx.tpl,fx.skip.slice(),fx.name);p.id=fx.id;
  const L=S(p),steps=L.length+2,start=now-(steps*2+n)*FX_DAY;p.created=start;
  Object.assign(p.f,fx.f);for(const [k,v] of Object.entries(fx.resp||{}))p.f['resp_'+k]=v;
  p.comps=fx.comps.map(c=>({...c}));
  const log=[{t:start,u:'',x:'Продукт создан по карте «'+t.name+'» (тестовые данные)'}];
  L.forEach((s,i)=>{const at=start+(i+1)*2*FX_DAY;
   if(fx.approved.includes(s.id)){p.status[s.id]='approved';p.checks[s.id]=s.checks.map(()=>true);p.at[s.id]=at;p.by[s.id]='';
    if(fx.comments&&fx.comments[s.id])p.comment[s.id]=fx.comments[s.id];
    log.push({t:at,u:'',x:'«'+s.name+'» согласован'+(p.comment[s.id]?': '+p.comment[s.id]:'')})}
   else if(fx.rework&&fx.rework[s.id]){p.status[s.id]='rework';p.comment[s.id]=fx.rework[s.id];
    log.push({t:at,u:'',x:'«'+s.name+'» возвращён на доработку: '+fx.rework[s.id]})}
   if(fx.checks&&fx.checks[s.id])p.checks[s.id]=fx.checks[s.id].slice();
   if(s.gates&&fx.finalChecks)p.checks[s.id]=s.checks.map(()=>true)});
  for(const [k,x] of Object.entries(fx.ai||{})){const at=(p.at[k]||now)-FX_DAY/4;p.ai[k]={x,t:at};log.push({t:at,u:'',x:'Claude проверил этап «'+L.find(s=>s.id===k).name+'»'})}
  p.log=log.sort((a,b)=>b.t-a.t);out[p.id]=p});
 return out}

/* Отрисовка интерфейса */
/* ================= ОТРИСОВКА ================= */
function renderAll(){renderSel();if(view==='new'){renderNew();return}if(!cur||!P()){renderEmpty();return}renderMain()}
function renderSel(){const ids=Object.keys(products).filter(id=>known(products[id])).sort((a,b)=>(products[b].created||0)-(products[a].created||0));
 $('#psel').innerHTML=ids.length?ids.map(id=>`<option value="${esc(id)}"${id===cur?' selected':''}>${esc(products[id].f?.name||'Без названия')}</option>`).join(''):'<option>Нет продуктов</option>';$('#psel').disabled=!ids.length}
function renderEmpty(){$('#app').innerHTML=`<div class="wrap empty"><h1>Проведите новый продукт через все подразделения</h1>
 <p>Выберите технологическую карту компании по страхованию жизни — пенсионный аннуитет, накопительное страхование жизни или ОСНС — и отметьте подразделения, которые участвуют в маршруте. Этап нельзя согласовать, пока не заполнены обязательные данные и не закрыт чек-лист; следующий открывается только после согласования предыдущего. В конце система сверяет продукт с рынком и выпускает паспорт.</p>
 <div class="dec"><button class="btn pri" data-act="new">Создать продукт</button>${Object.values(TPL).map(t=>`<button class="btn" data-act="demo" data-tpl="${t.id}">Пример: ${esc(({annuity:'пенсионный аннуитет',endow:'накопительное страхование',osns:'ОСНС'})[t.id]||t.name)}</button>`).join('')}<button class="btn" data-act="fixtures">Тестовые данные: ${FIXTURES.length} продуктов</button></div>
 ${hiddenCount()?`<p class="small" style="margin-top:16px">Скрыто продуктов по удалённой карте «Производство»: ${hiddenCount()}. Они остаются в выгрузке JSON.</p>`:''}</div>`}

function renderNew(){const t=TPL[draft.tpl];
 $('#app').innerHTML=`<div class="wrap empty" style="max-width:900px"><h1>Новый продукт</h1>
 <h3 class="lbl">1. Технологическая карта</h3><div class="tpls">${Object.values(TPL).map(x=>`<label class="tpl${x.id===draft.tpl?' on':''}"><input type="radio" name="tpl" value="${x.id}"${x.id===draft.tpl?' checked':''}><b>${esc(x.name)}</b><span>${esc(x.sub)}</span><span class="small">${x.stages.length} этапов</span></label>`).join('')}</div>
 <h3 class="lbl">2. Подразделения в маршруте</h3><p class="small" style="margin:0 0 8px">Обязательные подразделения входят всегда. Необязательные можно исключить — маршрут сомкнётся без них.</p>
 <ol class="deps">${t.stages.map(s=>`<li><label><input type="checkbox" data-dep="${s.id}"${s.opt?'':' disabled'}${(draft.skip||[]).includes(s.id)?'':' checked'}><span><b>${esc(s.dept)}</b> — ${esc(s.name)}</span><span class="small">${s.opt?'по выбору':'обязательно'}</span></label></li>`).join('')}</ol>
 <h3 class="lbl">3. Название</h3><input class="i" id="nname" value="${esc(draft.name||'')}" placeholder="Например: Пенсионный аннуитет «Надёжный»" style="max-width:560px">
 <div class="dec"><button class="btn pri" data-act="create">Создать маршрут</button><button class="btn" data-act="cancel">Отмена</button></div></div>`}

const stampSvg='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function overall(p){const L=S(p);if(p.status.final==='approved')return['Готов к запуску','c-ok'];
 const rw=L.find(s=>p.status[s.id]==='rework');if(rw)return['На доработке: '+rw.name,'c-rw'];
 const i=firstOpen(p);return['Этап '+(i+1)+' из '+L.length+': '+L[i].name,'c-op']}

function renderMain(){const p=P(),L=S(p),c=calc(p),o=overall(p),done=L.filter(s=>p.status[s.id]==='approved').length;
 $('#app').innerHTML=`<section class="hero"><div class="wrap">
  <div><div class="eyebrow">${esc(T(p).name)}</div><h1 id="hname">${esc(p.f.name||'Без названия')}</h1>
   <div class="status"><span class="chip ${o[1]}">${esc(o[0])}</span> &nbsp;Согласовано <b>${done} из ${L.length}</b> этапов</div>
   <div class="prog"><i style="width:${done/L.length*100}%"></i></div></div>
  <div class="score"><div class="n" id="hscore">${fmt(c.score)}</div><div class="l">балл соответствия рынку из 100</div></div>
 </div></section>
 <nav class="wrap"><div class="route" id="route"></div></nav>
 <div class="wrap main"><section id="stage"></section><aside id="side"></aside></div>`;
 renderRoute();renderStage();renderSide()}

function renderRoute(){const p=P();$('#route').innerHTML=S(p).map((s,i)=>{const k=st(p,i);
 return `<button class="st ${k}${i===si?' cur':''}" data-go="${i}" aria-current="${i===si?'step':'false'}" title="${esc(s.dept)}"><span class="seal">${k==='ok'?stampSvg:i+1}</span><span class="nm">${esc(s.name)}</span><span class="dp">${esc(s.dept)}</span></button>`}).join('');
 const el=$('#route .cur');if(el)el.scrollIntoView({block:'nearest',inline:'nearest'})}

function fieldHtml(p,x,ro){const v=p.f[x.k]??'',id='f_'+x.k,lab=`${esc(x.l)}${x.r?' <span class="req">*</span>':''}`,dis=ro?' disabled':'';
 let inp;if(x.t==='area')inp=`<textarea class="i" id="${id}" data-k="${x.k}"${dis}>${esc(v)}</textarea>`;
 else if(x.t==='sel')inp=`<select class="i" id="${id}" data-k="${x.k}"${dis}>${x.o.map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${o?esc(o):'— выберите —'}</option>`).join('')}</select>`;
 else inp=`<input class="i" id="${id}" data-k="${x.k}" value="${esc(v)}" ${x.t==='num'?'inputmode="decimal"':x.t==='date'?'type="date"':''}${dis}>`;
 return `<label class="f${x.full?' full':''}" for="${id}"><span>${lab}</span>${inp}</label>`}

function renderStage(){const p=P(),L=S(p),s=L[si],k=st(p,si),ro=k==='ok'||k==='lock',ch=p.checks[s.id]||[],ai=p.ai[s.id];
 const chip={ok:['Согласовано','c-ok'],rw:['На доработке','c-rw'],op:['В работе','c-op'],lock:['Ожидает предыдущий этап','c-lk']}[k];
 let h=`<div class="shead"><div><div class="eyebrow">Этап ${si+1} из ${L.length} · ${esc(s.dept)}</div><h2>${esc(s.name)}</h2></div><span class="chip ${chip[1]}">${chip[0]}</span></div>`;
 if(k==='lock')h+=`<p class="note">Этап откроется после согласования этапа «${esc(L[si-1].name)}». Технологическая цепочка соблюдается строго по порядку.</p>`;
 if(k==='ok')h+=`<p class="note">Этап закрыт согласованием. Чтобы изменить данные, отзовите согласование — все последующие этапы вернутся в работу.</p>`;
 if(k==='rw'&&p.comment[s.id])h+=`<p class="note r">Возвращено на доработку: ${esc(p.comment[s.id])}</p>`;
 h+=`<div class="grid">${fieldHtml(p,{k:'resp_'+s.id,l:'Ответственный от подразделения'},ro)}<span></span>${s.fields.map(x=>fieldHtml(p,x,ro)).join('')}</div>`;
 if(s.comps)h+=compsHtml(p,ro);
 if(s.econ)h+=`<div class="blk"><h3>Расчёт экономики</h3><div class="figs" id="econ"></div></div>`;
 if(s.gates)h+=`<div class="blk"><h3>Сверка с рынком и технологической цепочкой</h3><ul class="gates" id="gates"></ul></div>`;
 h+=`<div class="blk"><h3>Чек-лист подразделения</h3><ul class="checks">${s.checks.map((c,j)=>`<li><label><input type="checkbox" id="chk_${j}" data-chk="${j}"${ch[j]?' checked':''}${ro?' disabled':''}>${esc(c)}</label></li>`).join('')}</ul></div>`;
 h+=`<div class="blk ai"><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><div><b>Экспертная проверка Claude</b><div class="meta">Взгляд: ${esc(s.ai)}. Без доступа к интернету — оценки рынка и права нужно перепроверить.</div></div>
  <button class="btn" data-act="ai" id="aibtn"${sample?'':' disabled'}>${ai?'Проверить заново':'Проверить этап'}</button></div>
  <div class="out" id="aiout">${ai?esc(ai.x):'<span class="meta">'+(sample?'Claude проверит данные этапа с учётом предыдущих этапов и укажет риски.':'Станет доступно после подключения проверки Claude к странице.')+'</span>'}</div>${ai?`<div class="meta" style="margin-top:8px">Проверка от ${dt(ai.t)}</div>`:''}</div>`;
 h+=`<div class="blk"><h3>Решение</h3>`;
 if(k==='ok'){h+=`<div class="who">Согласовано ${dt(p.at[s.id])}${p.by[s.id]?` · <span data-uid="${esc(p.by[s.id])}">сотрудник</span>`:''}${p.comment[s.id]?' · '+esc(p.comment[s.id]):''}</div>
  <div class="dec"><button class="btn warn" data-act="revoke">Отозвать согласование</button></div>`}
 else if(k!=='lock'){h+=`<label class="f" for="cmt">Комментарий${s.gates?' (обязателен, если сверка выявила отклонения)':' (обязателен при возврате)'}<textarea class="i" id="cmt" data-cmt="1">${esc(k==='rw'?'':p.comment[s.id]||'')}</textarea></label>
  <div class="dec"><button class="btn pri" data-act="approve" id="apr">Согласовать этап</button><button class="btn warn" data-act="rework">Вернуть на доработку</button></div><div class="miss" id="miss"></div>`}
 h+=`</div>`;
 if(s.gates)h+=passHtml(p);
 h+=`<div class="nav"><button class="btn" data-go="${si-1}"${si===0?' disabled':''}>← Предыдущий</button><button class="btn" data-act="del">Удалить продукт</button><button class="btn" data-go="${si+1}"${si===L.length-1?' disabled':''}>Следующий →</button></div>`;
 $('#stage').innerHTML=h;updateLive();fillNames()}

function compsHtml(p,ro){const cf=T(p).comp,rows=(p.comps||[]).map((c,i)=>`<tr><td><input class="i" aria-label="Название" data-comp="${i}:n" value="${esc(c.n)}"${ro?' disabled':''}></td><td class="num"><input class="i" style="text-align:right" inputmode="decimal" aria-label="${esc(cf.col)}" data-comp="${i}:p" value="${esc(c.p)}"${ro?' disabled':''}></td><td>${ro?'':`<button class="btn" data-act="delcomp" data-i="${i}" aria-label="Удалить">×</button>`}</td></tr>`).join('');
 return `<div class="blk" id="comps" tabindex="-1"><h3>${esc(cf.title)}</h3><table class="stack"><thead><tr><th>Компания / аналог</th><th class="num">${esc(cf.col)}</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="3" class="small">${esc(cf.hint)}</td></tr>`}</tbody></table>${ro?'':`<div class="dec"><button class="btn" data-act="addcomp">Добавить</button><button class="btn" data-act="pastecomp">Вставить таблицу из Excel</button></div>
 <div id="pastebox" hidden><label class="f" for="pastein" style="margin-top:12px">Скопируйте из Excel или с сайта два столбца — название и значение (${esc(cf.col)}). Строки без числа пропускаются.<textarea class="i" id="pastein" placeholder="КСЖ А&#9;6700&#10;КСЖ Б&#9;7200"></textarea></label>
 <div class="dec"><button class="btn pri" data-act="importcomp">Загрузить строки</button><label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pastereplace" checked style="width:20px;height:20px;accent-color:var(--teal)">Заменить текущий список</label></div></div>`}
 <label class="f" for="f_compSrc" style="margin-top:14px">Источник данных и дата<input class="i" id="f_compSrc" data-k="compSrc" value="${esc(p.f.compSrc||'')}" placeholder="Например: тарифы с сайтов компаний, статистика регулятора на 01.11.2026"${ro?' disabled':''}></label></div>`}

function updateLive(){const p=P(),c=calc(p);
 const e=$('#econ');if(e)e.innerHTML=T(p).figs(c).map(x=>`<div><b>${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('');
 const g=$('#gates');if(g)g.innerHTML=gates(p).map(x=>`<li><span class="dot ${x.ok===null?'u':x.ok?'y':'n'}">${x.ok===null?'':x.ok?'✓':'!'}</span><span>${esc(x.t)}</span><span class="v">${esc(x.v)}</span></li>`).join('');
 const m=$('#miss'),a=$('#apr');
 document.querySelectorAll('#stage .need').forEach(x=>x.classList.remove('need'));
 if(m&&a){const ms=missing(p,si);a.disabled=ms.length>0;
  m.innerHTML=ms.length?'Для согласования не хватает:<ul class="misslist">'+ms.map(x=>`<li><button type="button" class="lnk" ${x.go!=null?`data-go="${x.go}"`:`data-jump="${esc(x.ref)}"`}>${esc(x.t)}</button></li>`).join('')+'</ul>':'';
  for(const x of ms){const el=x.ref&&document.getElementById(x.ref);if(el)(el.closest('label.f,.checks li')||el).classList.add('need')}}
 $('#hscore').textContent=fmt(c.score);$('#hname').textContent=p.f.name||'Без названия'}

function renderSide(){const p=P(),c=calc(p),sd=T(p).side(c),gs=gates(p),ok=gs.filter(x=>x.ok).length,bad=gs.filter(x=>x.ok===false).length,L=S(p);
 const kv=a=>'<dl class="kv">'+a.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')+'</dl>';
 $('#side').innerHTML=`<div class="box"><h3>Сверка с рынком</h3>${c.parts.map(x=>`<div class="bar"><span>${x[0]}</span><span class="v">${fmt(x[1],1)} / ${x[2]}</span><span class="t"><i style="width:${x[1]/x[2]*100}%"></i></span></div>`).join('')}<div style="margin-top:14px">${kv(sd.m)}</div></div>
 <div class="box"><h3>Ключевые показатели</h3>${kv(sd.e)}</div>
 <div class="box"><h3>Контрольные точки</h3><p class="small" style="margin:0 0 10px">${ok} выполнено, ${bad} с отклонением, ${gs.length-ok-bad} без данных</p>
  <div class="dec" style="margin-top:0"><button class="btn" data-act="copy">Скопировать паспорт</button><button class="btn" data-go="${L.length-1}">Открыть сверку</button></div><div id="copyw"></div></div>
 <div class="box"><h3>Подразделения</h3><ul class="log">${L.map((s,i)=>`<li>${i+1}. ${esc(s.dept)} <span class="small">· ${({ok:'согласовано',rw:'на доработке',op:'в работе',lock:'ожидает'})[st(p,i)]}</span></li>`).join('')}</ul>${(p.skip||[]).length?`<p class="small">Исключены: ${esc(T(p).stages.filter(s=>p.skip.includes(s.id)).map(s=>s.dept).join(', '))}</p>`:''}</div>
 <div class="box"><h3>Журнал</h3><ul class="log">${(p.log||[]).slice(0,12).map(l=>`<li><time>${dt(l.t)}${l.u?` · <span data-uid="${esc(l.u)}">сотрудник</span>`:''}</time>${esc(l.x)}</li>`).join('')||'<li class="small">Пока пусто</li>'}</ul></div>`;fillNames()}

function passportText(p){const c=calc(p),L=S(p),cf=T(p).comp,out=['ПАСПОРТ ПРОДУКТА: '+(p.f.name||''),'Технологическая карта: '+T(p).name,'Статус: '+overall(p)[0],''];
 L.forEach((s,i)=>{out.push('== '+(i+1)+'. '+s.name+' ('+s.dept+') — '+({ok:'согласовано',rw:'на доработке',op:'в работе',lock:'не начат'}[st(p,i)]));
  if(filled(p.f['resp_'+s.id]))out.push('Ответственный: '+p.f['resp_'+s.id]);
  s.fields.forEach(x=>{if(filled(p.f[x.k]))out.push(x.l+': '+p.f[x.k])});
  if(s.comps)(p.comps||[]).forEach(x=>{if(filled(x.n))out.push(x.n+' — '+cf.col+': '+x.p)});
  if(s.econ)out.push('Расчёт: '+T(p).figs(c).map(x=>x[0]+' '+x[1]).join('; '));
  if(p.comment[s.id])out.push('Комментарий: '+p.comment[s.id]);out.push('')});
 out.push('== Сверка с рынком (балл '+fmt(c.score)+' из 100)');gates(p).forEach(g=>out.push((g.ok===null?'[ ] ':g.ok?'[+] ':'[!] ')+g.t+' — '+g.v));return out.join('\n')}

function passHtml(p){const c=calc(p),ready=p.status.final==='approved';
 const sec=S(p).slice(0,-1).map(s=>{const rows=s.fields.filter(x=>filled(p.f[x.k])).slice(0,4).map(x=>`<p><span class="small">${esc(x.l)}:</span> ${esc(p.f[x.k])}</p>`).join('');return `<h4>${esc(s.dept)} · ${esc(s.name)} · ${p.status[s.id]==='approved'?'согласовано':'не согласовано'}</h4>${rows||'<p class="small">Нет данных</p>'}`}).join('');
 return `<div class="pass"><div class="eyebrow">Паспорт продукта · ${esc(T(p).name)}</div><h3>${esc(p.f.name||'')}</h3>
 <p style="margin-top:8px">Балл рынка ${fmt(c.score)} из 100 · ${esc(T(p).head(c))}</p>
 ${ready?`<div class="stamp">Готов к запуску · ${dt(p.at.final)}</div>`:'<p class="small">Паспорт станет итоговым после финального решения.</p>'}${sec}</div>`}


/* ---- js/actions.js ---- */
/* Действия пользователя и обработчики событий */
/* ================= ДЕЙСТВИЯ ================= */
function openProduct(id){view='main';cur=id;si=firstOpen(products[id]);renderAll()}
function go(i){const p=P();if(!p||i<0||i>=S(p).length)return;si=i;renderRoute();renderStage();window.scrollTo({top:$('#route').getBoundingClientRect().top+scrollY-10,behavior:'smooth'})}
function create(p){products[p.id]=p;addLog(p,'Продукт создан по карте «'+T(p).name+'»');touch(p);openProduct(p.id)}
function demo(tpl){const p=blank(tpl),t=TPL[tpl],done=t.demo(p),now=Date.now();
 done.forEach((id,i)=>{const s=t.stages.find(x=>x.id===id);if(!s||(p.skip||[]).includes(id))return;p.status[id]='approved';p.checks[id]=s.checks.map(()=>true);p.at[id]=now-(done.length-i)*864e5;p.by[id]=uid||''});
 if(tpl==='annuity')p.f.resp_act='Назначенный актуарий';
 p.log=[{t:now,u:uid||'',x:'Пример: согласованы этапы до финансового обоснования включительно'}];products[p.id]=p;touch(p);openProduct(p.id)}

function decide(kind){const p=P(),L=S(p),s=L[si],cm=($('#cmt')?.value||'').trim(),m=$('#miss');
 if(kind==='rework'){if(!cm){m.textContent='Укажите в комментарии, что нужно доработать.';$('#cmt').focus();return}
  p.status[s.id]='rework';p.comment[s.id]=cm;addLog(p,'«'+s.name+'» возвращён на доработку: '+cm)}
 if(kind==='approve'){if(missing(p,si).length)return;
  if(s.gates&&gates(p).some(g=>g.ok===false)&&!cm){m.textContent='Сверка выявила отклонения: опишите в комментарии, почему риск принимается.';$('#cmt').focus();return}
  p.status[s.id]='approved';p.comment[s.id]=cm;p.at[s.id]=Date.now();p.by[s.id]=uid||'';addLog(p,'«'+s.name+'» согласован'+(cm?': '+cm:''))}
 if(kind==='revoke'){revokeFrom(p,si);addLog(p,'Отозвано согласование «'+s.name+'», последующие этапы возвращены в работу')}
 touch(p);if(kind==='approve'&&si<L.length-1)si++;renderMain();renderSel()}

async function runAI(){const p=P(),s=S(p)[si],out=$('#aiout'),b=$('#aibtn');if(!sample)return;
 b.disabled=true;out.textContent='Claude изучает материалы…';
 const prompt=`Ты — ${s.ai}. Контекст: ${T(p).ctx}. Новый продукт проходит маршрут согласования подразделений. Проверь этап «${s.name}» (${s.dept}) с позиции своего подразделения, учитывая данные предыдущих этапов и согласованность всей цепочки.

Данные проекта:
${passportText(p)}

Ответь по-русски простым текстом без markdown, не более 250 слов, тремя разделами: «Оценка», «Риски и пробелы», «Что сделать до согласования». У тебя нет доступа к интернету и актуальным данным: где говоришь о рыночных условиях, нормах права, требованиях регулятора или ставках, помечай это как оценку, требующую проверки специалистом.`;
 try{const r=await sample(prompt,{onText:({text})=>{out.textContent=text},modelTier:'default'});
  p.ai[s.id]={x:r.text,t:Date.now()};addLog(p,'Claude проверил этап «'+s.name+'»');touch(p);renderStage();renderSide()}
 catch(e){out.textContent=e&&e.code==='rate_limited'?'Слишком много запросов — попробуйте через минуту.':e&&e.code==='not_granted'?'Проверка Claude недоступна в этом просмотре.':'Не удалось получить ответ. Попробуйте ещё раз.';if(e&&e.code==='not_granted')sample=null;b.disabled=!sample}}

async function copyPass(){const t=passportText(P()),w=$('#copyw');try{await navigator.clipboard.writeText(t);w.innerHTML='<p class="small">Паспорт скопирован в буфер обмена.</p>'}
 catch(e){w.innerHTML='<textarea id="copyfall" class="i" readonly></textarea>';const ta=$('#copyfall');ta.value=t;ta.select()}}

/* Переход к незаполненному полю из списка недостающего */
function jump(ref){const el=document.getElementById(ref);if(!el)return;
 el.scrollIntoView({block:'center',behavior:'smooth'});
 const f=el.matches('input,select,textarea,button')?el:el.querySelector('input,select,textarea,button');if(f)f.focus({preventScroll:true})}

/* Резервная копия всех продуктов в JSON-файл и загрузка обратно (пока общее хранилище не подключено) */
/* Выгрузка открывает панель с JSON: его можно скопировать (работает везде, в том числе в опубликованном артефакте)
   или скачать файлом (работает при локальном запуске; в артефакте браузер скачивание блокирует). */
const exportText=()=>JSON.stringify({app:'product-route',v:1,at:new Date().toISOString(),products},null,2);
function exportJson(){const ids=Object.keys(products);if(!ids.length){setSync('Нет продуктов для выгрузки');return}
 const box=$('#exportbox'),ta=$('#exporttext');ta.value=exportText();box.hidden=false;$('#exportmsg').textContent='Продуктов в копии: '+ids.length+'. Сохраните текст в файл .json или передайте коллеге.';ta.focus();ta.select()}
async function exportCopy(){const ta=$('#exporttext'),m=$('#exportmsg');
 try{await navigator.clipboard.writeText(ta.value);m.textContent='Скопировано в буфер обмена.'}catch(e){ta.focus();ta.select();m.textContent='Буфер обмена недоступен: текст выделен, скопируйте его сочетанием Ctrl+C.'}}
function exportFile(){const blob=new Blob([$('#exporttext').value],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='marshrut-produktov-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 $('#exportmsg').textContent='Если файл не скачался, скопируйте текст кнопкой «Скопировать».'}
function importJson(text){let data;try{data=JSON.parse(text)}catch(e){setSync('Файл не похож на выгрузку приложения');return}
 const src=data&&data.products&&typeof data.products==='object'?data.products:data;let n=0;
 for(const [id,v] of Object.entries(src||{})){if(!v||typeof v!=='object'||!v.f||!v.status||!TPL[v.tpl])continue;
  v.id=id;for(const k of ['skip','comps','log'])if(!Array.isArray(v[k]))v[k]=[];
  for(const k of ['checks','by','at','comment','ai'])if(!v[k]||typeof v[k]!=='object')v[k]={};
  products[id]=v;addLog(v,'Продукт загружен из файла');touch(v);n++}
 if(!n){setSync('В файле не найдено продуктов');return}
 setSync('Загружено продуктов: '+n);if(!cur||!P())cur=firstId();openProduct(cur)}

/* Тестовые данные из js/fixtures.js: повторная загрузка заменяет их свежей копией, устаревшие тестовые продукты удаляются */
function loadFixtures(){const fx=buildFixtures(Date.now()),ids=Object.keys(fx);
 for(const id of Object.keys(products))if(id.startsWith("test-")&&!fx[id]){delete products[id];clearTimeout(timers[id]);if(db)db.doc("products/"+id).delete().catch(()=>{})}
 if(!db)lsSave();
 for(const id of ids){products[id]=fx[id];touch(fx[id])}
 setSync("Загружено тестовых продуктов: "+ids.length);openProduct(ids[0])}

document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&!g.disabled){go(+g.dataset.go);return}
 const jm=e.target.closest('[data-jump]');if(jm){jump(jm.dataset.jump);return}
 const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const act=a.dataset.act,p=P();
 if(act==='export'){exportJson();return}
 if(act==='exportcopy'){exportCopy();return}
 if(act==='exportfile'){exportFile();return}
 if(act==='exportclose'){$('#exportbox').hidden=true;return}
 if(act==='importtext'){importJson($('#exporttext').value);$('#exportbox').hidden=true;return}
 if(act==='import'){$('#importfile').click();return}
 if(act==='fixtures'){loadFixtures();return}
 if(act==='new'){view='new';draft={tpl:'annuity',skip:[],name:''};renderAll()}
 else if(act==='cancel'){view='main';renderAll()}
 else if(act==='create'){const nm=($('#nname').value||'').trim();create(blank(draft.tpl,draft.skip,nm||'Новый продукт'))}
 else if(act==='demo')demo(a.dataset.tpl);
 else if(act==='approve'||act==='rework'||act==='revoke')decide(act);
 else if(act==='ai')runAI();else if(act==='copy')copyPass();
 else if(act==='pastecomp'){const b=$('#pastebox');b.hidden=!b.hidden;if(!b.hidden)$('#pastein').focus()}
 else if(act==='importcomp'){const rows=parseComps($('#pastein').value);
  if(!rows.length){$('#pastein').focus();return}p.comps=$('#pastereplace').checked?rows:(p.comps||[]).concat(rows);addLog(p,'Загружено строк рыночных данных: '+rows.length);touch(p);renderStage();renderSide()}
 else if(act==='addcomp'){p.comps=p.comps||[];p.comps.push({n:'',p:''});touch(p);renderStage()}
 else if(act==='delcomp'){p.comps.splice(+a.dataset.i,1);touch(p);renderStage();renderSide()}
 else if(act==='del'){if(a.dataset.sure){const id=p.id;delete products[id];clearTimeout(timers[id]);if(db)db.doc('products/'+id).delete().catch(()=>{});else lsSave();cur=firstId();if(cur)openProduct(cur);else renderAll()}
  else{a.dataset.sure=1;a.textContent='Точно удалить?';a.classList.add('warn');setTimeout(()=>{if(a.isConnected){delete a.dataset.sure;a.textContent='Удалить продукт';a.classList.remove('warn')}},4000)}}});

document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='importfile'){const file=t.files&&t.files[0];if(file)file.text().then(importJson);t.value='';return}
 if(view==='new'&&t.name==='tpl'){draft.tpl=t.value;draft.skip=[];draft.name=$('#nname').value;renderNew();return}
 if(view==='new'&&t.dataset.dep){const id=t.dataset.dep;draft.skip=draft.skip.filter(x=>x!==id);if(!t.checked)draft.skip.push(id);return}});
document.addEventListener('input',e=>{const t=e.target,p=P();if(view!=='main'||!p)return;
 if(t.dataset.k){p.f[t.dataset.k]=t.value}
 else if(t.dataset.chk){const id=S(p)[si].id;p.checks[id]=p.checks[id]||[];p.checks[id][+t.dataset.chk]=t.checked}
 else if(t.dataset.comp){const[i,f]=t.dataset.comp.split(':');p.comps[+i][f]=t.value}
 else if(t.dataset.cmt){updateLive();return}else return;
 touch(p);updateLive();renderSide();if(t.dataset.k==='name')renderSel()});
$('#psel').addEventListener('change',e=>openProduct(e.target.value));


/* ---- js/main.js ---- */
/* Запуск приложения и подключение общего хранилища */
/* ================= ЗАПУСК ================= */
/* В опубликованном артефакте браузер не даёт скачивать файлы: оставляем только копирование JSON */
if(window.claude){const b=document.querySelector("[data-act=exportfile]");if(b)b.hidden=true}
lsLoad();cur=firstId();if(cur)si=firstOpen(products[cur]);renderAll();
(async()=>{const C=window.claude;if(!C||!C.use)return;
 [db,user,sample]=await Promise.all([C.use('db').catch(()=>null),C.use('user').catch(()=>null),C.use('sample').catch(()=>null)]);
 if(user){try{uid=await user.id()}catch(e){}}
 if(sample&&P()&&view==='main')renderStage();
 if(!db)return;
 setSync('Подключение…');const to=setTimeout(()=>setSync('Общее хранилище недоступно — данные могут быть неактуальны'),10000);
 let first=true;
 db.collection('products').onSnapshot(snap=>{if(!snap.metadata.fromCache){clearTimeout(to);setSync('Общий доступ · синхронизировано')}
  const next={};let full=first;
  for(const d of snap.docs){const v=JSON.parse(JSON.stringify(d.data()||{}));const loc=products[d.id];
   if(loc&&!first&&(timers[d.id]||busy[d.id])){next[d.id]=loc;continue}
   if(!v.f||!v.status)continue;v.id=d.id;next[d.id]=v;
   if(d.id===cur&&(!loc||(v._c!==CID&&v._t!==loc._t)))full=true}
  const hadCur=cur&&next[cur];products=next;
  if(first||!hadCur){cur=hadCur?cur:firstId();if(cur)si=firstOpen(products[cur]);first=false;renderAll();return}
  renderSel();if(view!=='main')return;
  if(full){const ae=document.activeElement,aid=ae&&ae.id;renderMain();if(aid){const n=document.getElementById(aid);if(n)n.focus()}}else{renderRoute();renderSide();updateLive()}
 },()=>{clearTimeout(to);setSync('Общее хранилище недоступно')});
})();

}
</script>
